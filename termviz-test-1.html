    <header class="topbar">
      <div>
        <p class="eyebrow">TermViz · D3 <span id="d3version"></span></p>
        <h1>Sample graph</h1>
        <p class="lede">
          The cardiovascular fragment shipped with the 2013 demo, drawn with the D3 7 force layout.
          Arrows run from the more specific concept toward its parent.
          <a href="/TermViz/legacy/termviz-test-1-d3v2.html">The original D3 v2 page</a> is unchanged.
