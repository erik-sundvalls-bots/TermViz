<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDR Catalyst — unified knowledge graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/kg-demo.css" />
  </head>
  <body>
    <div class="kg-shell">
      <header class="kg-topbar">
        <h1>CDR Catalyst — unified knowledge graph</h1>
        <a href="%BASE_URL%">TermViz</a>
        <a href="%BASE_URL%termviz-mapper-test.html">IPS mapping bench</a>
        <div class="kg-controls">
          <label>Example <select id="kgExample" aria-label="Knowledge-graph example"></select></label>
          <input id="kgSearch" type="search" placeholder="Search nodes…" aria-label="Search graph" />
          <label>Ontology
            <select id="kgOntology" aria-label="Filter ontology">
              <option value="all">All</option>
              <option value="sct">SNOMED CT</option>
              <option value="npu">NPU</option>
              <option value="icd10">ICD-10</option>
              <option value="atc">ATC</option>
              <option value="ucum">UCUM</option>
            </select>
          </label>
          <span role="group" aria-label="Patient instances">
            <button type="button" class="kg-btn is-on" data-patient="both">Both patients</button>
            <button type="button" class="kg-btn" data-patient="eva">Eva only</button>
            <button type="button" class="kg-btn" data-patient="lars">Lars only</button>
          </span>
          <button type="button" class="kg-btn" id="kgClearSel">Clear selection</button>
        </div>
      </header>
      <p id="kgError" class="kg-error" hidden style="margin:8px 14px"></p>
      <div class="kg-main">
        <div class="kg-viewport" id="kgViewport">
          <svg id="kgSvg" role="img" aria-label="Layered knowledge graph"></svg>
          <div class="kg-zoom" aria-label="Zoom">
            <button type="button" id="kgZoomIn" aria-label="Zoom in">+</button>
            <button type="button" id="kgZoomOut" aria-label="Zoom out">−</button>
            <button type="button" id="kgFit" aria-label="Fit graph">Fit</button>
          </div>
          <div class="kg-status" id="kgStatus">Loading…</div>
        </div>
        <aside class="kg-aside" id="kgAside" aria-label="Node details">
          <div class="kg-legend">
            <span><i style="background:#7eb8da"></i>concept</span>
            <span><i style="background:#5ba865"></i>template</span>
            <span><i style="background:#9b7bb8"></i>archetype</span>
            <span><i style="background:#d4826a"></i>instance</span>
          </div>
          <div class="kg-panel-filters" role="group" aria-label="Layer visibility">
            <label><input type="checkbox" data-layer="0" checked /> Terminology</label>
            <label><input type="checkbox" data-layer="1" checked /> Template</label>
            <label><input type="checkbox" data-layer="2" checked /> Sections</label>
            <label><input type="checkbox" data-layer="3" checked /> Archetypes</label>
            <label><input type="checkbox" data-layer="4" checked /> Archetype nodes</label>
            <label><input type="checkbox" data-layer="5" checked /> Instances</label>
          </div>
          <div id="kgDetail">
            <p>Loading manifest…</p>
          </div>
        </aside>
      </div>
    </div>
    <div id="kgTooltip" class="kg-tooltip" role="tooltip"></div>
    <script type="module" src="/src/kg-demo.js"></script>
  </body>
</html>
