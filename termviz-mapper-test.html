<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TERMVIZ DEMO v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/TermViz/assets/mapper-bthcXuuo.js"></script>
    <link rel="modulepreload" crossorigin href="/TermViz/assets/termviz-2-BFBmNM96.js">
    <link rel="stylesheet" crossorigin href="/TermViz/assets/mapper-C0efme3h.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-mark" href="/TermViz/">TERMVIZ DEMO v2</a>
      <div class="stats" id="stats"></div>
    </header>
    <p class="error" id="error" hidden></p>
    <main id="bench">
      <section class="pane pane-snomed" id="snomedPane" aria-label="SNOMED CT graph">
        <div class="pane-bar">
          <h2>SNOMED CT</h2>
          <p class="caption" id="snomedCaption"></p>
          <div class="legend" aria-hidden="true">
            <span><i class="swatch shared"></i>shared</span>
            <span><i class="swatch hover-self"></i>hover</span>
            <span><i class="swatch hover-child"></i>child</span>
            <span><i class="swatch hover-parent"></i>parent</span>
          </div>
        </div>
        <div class="snomed-body">
          <div class="viewport" id="snomedViewport">
            <div class="empty" id="snomedEmpty">
              <p>Turn a category on in the list.</p>
            </div>
            <svg id="snomedSvg" role="img" aria-label="SNOMED CT graph"></svg>
          </div>
          <aside class="detail" id="detailShelf" aria-label="Mapping list">
            <button type="button" class="scroll-cue" id="cueUp" hidden aria-label="More entries above">▴</button>
            <div class="detail-scroll" id="detail"></div>
            <button type="button" class="scroll-cue" id="cueDown" hidden aria-label="More entries below">▾</button>
          </aside>
        </div>
      </section>
      <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-valuemin="18" aria-valuemax="82" aria-valuenow="60" aria-label="Resize the SNOMED and template panes" tabindex="0"></div>
      <section class="pane pane-tree" aria-label="International Patient Summary template">
        <div class="tool-bar">
          <h2>Template</h2>
          <div class="filter-cluster">
            <span class="filter-name">Filter</span>
            <label class="search" for="search">Find
              <input id="search" type="search" placeholder="Name or SNOMED id" />
            </label>
            <div class="filters" role="group" aria-label="Filter">
              <button type="button" data-filter="suggestions" class="is-on">Mapping suggestions</button>
              <button type="button" data-filter="bindings">Template bindings</button>
              <button type="button" data-filter="all">Whole template</button>
            </div>
          </div>
        </div>
        <div class="viewport" id="treeViewport">
          <svg id="treeSvg" role="img" aria-label="Template tree"></svg>
        </div>
      </section>
    </main>
    <svg id="linkOverlay" class="link-overlay" aria-hidden="true"></svg>
    <div id="conceptPop" class="concept-pop" hidden>
      <button type="button" class="pop-close" id="popClose" aria-label="Close">×</button>
      <h3 id="popTitle"></h3>
      <p id="popCode"></p>
      <dl id="popFacts"></dl>
      <div id="popSources"></div>
      <label class="pin-row">Pin in place
        <button type="button" id="popPin" class="switch" role="switch" aria-checked="false" aria-label="Pin in place"></button>
      </label>
    </div>
  </body>
</html>
